# The long-lived deployment: `:latest` images, no build, no pull.
#
# Merged over `docker-compose.yml` and `docker-compose.broker.yml`, never instead of them: the base
# file carries the binds and the environment, the broker overlay carries the broker, and this file
# only says which images this channel runs.
#
# `!reset null` drops the base file's build stanza, so `compose up` cannot quietly build a
# different thing than the image just built, and `pull_policy: never` stops `up` from pulling a
# published tag over it. Compose 2.24.4+ is required for `!reset`.
#
# Both images are built from their checkout, mounted at the same channel as the deployment:
#   docker build -t devockr/idsh:latest .              # this repository
#   docker build --target host -t code-vaults/gcb-host:latest .   # the broker's
# To run the published broker instead, pin it here and drop `pull_policy` (for example
# `ghcr.io/code-vaults/gcb-host:sha-<commit>`, multi-arch).
services:
  dsh:
    image: devockr/idsh:latest
    pull_policy: never
    build: !reset null
  gcb:
    image: code-vaults/gcb-host:latest
    pull_policy: never
