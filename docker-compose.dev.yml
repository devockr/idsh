# Dev overlay: the browser settings, for running the `:dev` image.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --no-build
#
# Neither variable does anything in the published image, which has no browser libraries on purpose.
services:
  dsh:
    # Built only by `pnpm dev`, which rebuilds :base first. Never built or pulled from here:
    # building the overlay would let a stale :base into a :dev that looks freshly built, and a
    # missing image would silently come from a registry instead of failing.
    image: devockr/idsh:dev
    pull_policy: never
    build: !reset null
    environment:
      # Where the browsers live. They are in no image, and this path is inside the state
      # directory, so a container rebuild re-uses them instead of downloading them again.
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/home/app/.dsh/cache/ms-playwright}
      # Browser binaries come from Playwright's CDN, which is slow on some networks. This is the
      # public npmmirror of the same builds — the host NPM_REGISTRY already defaults to in both
      # Dockerfiles. Point it elsewhere, or drop the line, if you prefer.
      - PLAYWRIGHT_DOWNLOAD_HOST=${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.npmmirror.com/binaries/playwright}

networks:
  default:
    # Docker gives a container IPv6 addresses only when its network has an IPv6 subnet: this daemon
    # has no default IPv6 address pool (`docker info` lists none), and `enable_ipv6` alone fails
    # with "could not find an available, non-overlapping IPv6 address pool". One explicit ULA is
    # enough — Docker still allocates the IPv4 subnet automatically. Change the range (RFC 4193
    # `fc00::/7`) if it collides with your LAN; the kernel's per-network `disable_ipv6` follows the
    # network, so the image needs no change.
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:d5c0:0:1::/64
