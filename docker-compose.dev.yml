# Dev overlay: the browser settings, for running the `:dev` image.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --no-build
#
# Neither variable does anything in the published image, which has no browser libraries on purpose.
services:
  dsh:
    # Built only by `pnpm dev`, which rebuilds :base first. Never built or pulled from here:
    # building the overlay would let a stale :base into a :dev that looks freshly built, and a
    # missing image would silently come from a registry instead of failing.
    image: devockr/idsh:dev
    pull_policy: never
    build: !reset null
    environment:
      # Where the browsers live. They are in no image, and this path is inside the state
      # directory, so a container rebuild re-uses them instead of downloading them again.
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/home/app/.dsh/cache/ms-playwright}
      # Browser binaries come from Playwright's CDN, which is slow on some networks. This is the
      # public npmmirror of the same builds — the host NPM_REGISTRY already defaults to in both
      # Dockerfiles. Point it elsewhere, or drop the line, if you prefer.
      - PLAYWRIGHT_DOWNLOAD_HOST=${PLAYWRIGHT_DOWNLOAD_HOST:-https://cdn.npmmirror.com/binaries/playwright}
      # The broker's socket lives inside the state directory, which is already mounted, so the
      # path needs no extra volume: with the `gcb` service below (or a host broker on the same
      # directory) git in this container asks the host for a credential instead of holding one.
      - GIT_BROKER_SOCKET=${GIT_BROKER_SOCKET:-/home/app/.dsh/git-broker/broker.sock}
    # The broker's socket has to exist first: `entrypoint.sh` runs `gcb setup` when it does, and a
    # boot that beat it would come up without a credential helper.
    depends_on:
      gcb:
        condition: service_healthy

  # The credential broker, from its own checkout's dev image: `gcb compose`'s default name, and
  # the same shape it renders. One broker serves the host, so this service replaces a standalone
  # one rather than joining it — two processes cannot bind the same socket path. The deployment
  # directory defaults to `~/.broker-host` because that is this overlay's own convention; override
  # `GCB_DEPLOY_DIR` when the config and key live elsewhere, and drop this service entirely when
  # the broker is supervised somewhere else.
  gcb:
    image: code-vaults/gcb-host:dev
    pull_policy: never
    container_name: gcb
    restart: unless-stopped
    # The socket is bound after the daemon starts and has read its config, so "started" is not
    # enough: dsh waits for this instead, and the entrypoint's own check then sees the socket.
    healthcheck:
      test: ['CMD-SHELL', 'test -S /run/git-broker/broker.sock']
      interval: 2s
      retries: 15
    user: '${GCB_UID:-${UID:?}}:${GCB_GID:-${GID:?}}'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - http_proxy=${http_proxy:-${HTTP_PROXY:-}}
      - https_proxy=${https_proxy:-${HTTPS_PROXY:-}}
      - no_proxy=${no_proxy:-${NO_PROXY:-}}
      - NODE_USE_ENV_PROXY=1
      - GCB_PROXY=${GCB_PROXY-default}
    command:
      - sh
      - -c
      - |
        case "${GCB_PROXY-default}" in
          default) ;;
          "") unset http_proxy https_proxy no_proxy NODE_USE_ENV_PROXY ;;
          *) export http_proxy="$$GCB_PROXY" https_proxy="$$GCB_PROXY" no_proxy=localhost,127.0.0.1 NODE_USE_ENV_PROXY=1 ;;
        esac
        exec gcb daemon --config /etc/git-cred-broker/broker.config.yml
    volumes:
      - ${GCB_DEPLOY_DIR:-${HOME}/.broker-host}/broker.config.yml:/etc/git-cred-broker/broker.config.yml:ro
      - ${GCB_DEPLOY_DIR:-${HOME}/.broker-host}/app.pem:/etc/git-cred-broker/app.pem:ro
      - ${GCB_DEPLOY_DIR:-${HOME}/.broker-host}/log:/var/log/git-cred-broker
      - ${GCB_SOCKET_DIR:-./.dsh/git-broker}:/run/git-broker

networks:
  default:
    # Docker gives a container IPv6 addresses only when its network has an IPv6 subnet: this daemon
    # has no default IPv6 address pool (`docker info` lists none), and `enable_ipv6` alone fails
    # with "could not find an available, non-overlapping IPv6 address pool". One explicit subnet is
    # enough — Docker still allocates the IPv4 one automatically.
    #
    # The default is a placeholder: a ULA (RFC 4193, `fc00::/7`) is private and has nothing to do
    # with your ISP prefix, so override `DSH_IPV6_SUBNET` in .env or your shell when it collides
    # with a network or route on the host (check `docker network inspect` and `ip -6 route`); a
    # second deployment on the same host collides on this default too, so give each its own.
    # Nothing here matches the host's global prefix on purpose: the kernel's per-network
    # `disable_ipv6` follows the network, so the image needs no change, and container traffic is
    # routed/NATed by the host like any other private subnet. Remove the whole block to keep the
    # network IPv4-only.
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${DSH_IPV6_SUBNET:-fd00:d5c0:0:1::/64}
