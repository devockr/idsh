# Template for the real compose file. Copy it and edit the values that are
# specific to your machine:
#
#   cp docker-compose.example.yml docker-compose.yml
#
# docker-compose.yml is gitignored on purpose — it is where your own hostnames,
# LAN addresses and proxy settings live, and those should not be published.
# Keep this template free of them: use example.com / RFC1918 addresses only.
services:
  dsh:
    build:
      context: .
      args:
        # From your shell or .env; the Dockerfile's own default applies when unset.
        - NPM_REGISTRY
    container_name: dsh
    hostname: dsh
    # Start as root so entrypoint.sh can re-point the image's `app` account at
    # PUID/PGID and fix ownership, then drop to that uid (setpriv) before exec'ing
    # dsh. Nothing about the uid is baked into the image, so it can be built once
    # and reused by anyone. `docker exec` therefore lands as root — use
    # `docker exec -u app ...` for a shell as the working user.
    user: '0:0'
    restart: always
    # PID 1 must reap orphans: dsh's tools daemonize (wrangler, `nohup ... &`),
    # those reparent to PID 1, and Node only waits on children it spawned itself, so
    # they pile up as zombies. Docker's init reaps them instead.
    init: true
    environment:
      # Host uid/gid to run dsh as; entrypoint.sh re-points `app` at them.
      # `:?` is load-bearing: UID/GID live in the environment only under some shells
      # (zsh/bash export them, most others do not), and an empty value silently falls
      # through to entrypoint.sh's ${PUID:-1000} — the container would run as uid
      # 1000. Fail loudly instead; from a shell that does not export them, use
      # `UID=$(id -u) GID=$(id -g) docker compose up -d`.
      - 'PUID=${UID:?UID is not set - export it or pass it explicitly}'
      - 'PGID=${GID:?GID is not set - export it or pass it explicitly}'
      # The one registry variable, from your shell or .env. entrypoint.sh turns it
      # into the user-level npm/pnpm/yarn config every project inherits, then drops
      # it; NPM_CONFIG_REGISTRY / YARN_NPM_REGISTRY_SERVER are not read, since as
      # environment variables they would outrank a project's own config.
      - NPM_REGISTRY
      # Space-separated authorities allowed by dsh's browser-trust fence; set it
      # to the host (or host:port) you reach this UI on, e.g. dsh.example.com.
      - DSH_TRUSTED_HOSTS
      # Address dsh binds. Left unset, the entrypoint uses this container's own address, which
      # is where the published port forwards; set it when the container has several networks and
      # the one Docker picked for the mapping is not the one your clients arrive on.
      - DSH_BIND_HOST
      # Public HTTP(S) root to advertise behind a prefix-stripping proxy; left unset when
      # absent. Advertising grants no trust, so the authority above still has to name it.
      - DSH_PUBLIC_URL
      # Proxy settings, from your shell or .env: an unset one is left unset rather than
      # injected empty, and dsh reads both proxy spellings and adds its own loopback bypass.
      # The DeepSeek API key is deliberately absent: add it in the web UI's settings, so it never
      # reaches the image or the process environment.
      - http_proxy
      - https_proxy
      - all_proxy
      - no_proxy
    ports:
      # Loopback only: put a reverse proxy in front, or widen this to '15080:3080' when the
      # port itself is what you publish.
      - '127.0.0.1:15080:3080'
    volumes:
      # Only dsh's own state: what else to mount is yours to decide.
      - ./.dsh:/home/app/.dsh
