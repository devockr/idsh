# Template for the real compose file. Copy it and edit the values that are
# specific to your machine:
#
#   cp docker-compose.example.yml docker-compose.yml
#
# docker-compose.yml is gitignored on purpose — it is where your own hostnames,
# LAN addresses and proxy settings live, and those should not be published.
# Keep this template free of them: use example.com / RFC1918 addresses only.
#
# This file is the base of a deployment, not the whole of one: the credential
# broker's definition lives in `docker-compose.broker.yml`, and a channel overlay
# picks the images — `docker-compose.dev.yml` for `:dev`/`code-vaults/gcb-host:dev`,
# `docker-compose.prod.yml` for pinned production tags. Merge base,
# broker and one channel, in that order:
#
#   GCB_IMAGE=code-vaults/gcb-host:dev docker compose -f docker-compose.yml \
#     -f docker-compose.broker.yml -f docker-compose.dev.yml up -d --no-build
#
# Running the broker in its container is the recommended shape; a deployment that
# supervises it on the host skips the broker file and `dsh`'s socket variable, as
# this template's comments note.
services:
  dsh:
    build:
      context: .
      args:
        # From your shell or .env; the Dockerfile's own default applies when unset.
        - NPM_REGISTRY
    container_name: dsh
    hostname: dsh
    # Start as root so entrypoint.sh can re-point the image's `app` account at
    # PUID/PGID and fix ownership, then drop to that uid (setpriv) before exec'ing
    # dsh. Nothing about the uid is baked into the image, so it can be built once
    # and reused by anyone. `docker exec` therefore lands as root — use
    # `docker exec -u app ...` for a shell as the working user.
    user: '0:0'
    restart: always
    # PID 1 must reap orphans: dsh's tools daemonize (wrangler, `nohup ... &`),
    # those reparent to PID 1, and Node only waits on children it spawned itself, so
    # they pile up as zombies. Docker's init reaps them instead.
    init: true
    environment:
      # Host uid/gid to run dsh as; entrypoint.sh re-points `app` at them.
      # `:?` is load-bearing: UID/GID live in the environment only under some shells
      # (zsh/bash export them, most others do not), and an empty value silently falls
      # through to entrypoint.sh's ${PUID:-1000} — the container would run as uid
      # 1000. Fail loudly instead; from a shell that does not export them, use
      # `UID=$(id -u) GID=$(id -g) docker compose up -d`.
      - 'PUID=${UID:?UID is not set - export it or pass it explicitly}'
      - 'PGID=${GID:?GID is not set - export it or pass it explicitly}'
      # The one registry variable, from your shell or .env. entrypoint.sh turns it
      # into the user-level npm/pnpm/yarn config every project inherits, then drops
      # it; NPM_CONFIG_REGISTRY / YARN_NPM_REGISTRY_SERVER are not read, since as
      # environment variables they would outrank a project's own config.
      - NPM_REGISTRY
      # Package-manager caches live in the mounted state directory, so a container rebuild reuses
      # what they downloaded. Corepack's default-version lookup reads its own variable; a compose
      # `NPM_REGISTRY` would not reach a `docker exec` without this line.
      - 'COREPACK_NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmmirror.com/}'
      - npm_config_cache=/home/app/.dsh/cache/npm
      - pnpm_config_store_dir=/home/app/.dsh/cache/pnpm-store
      # Space-separated authorities allowed by dsh's browser-trust fence; set it
      # to the host (or host:port) you reach this UI on, e.g. dsh.example.com.
      - DSH_TRUSTED_HOSTS
      # Address dsh binds. Left unset, the entrypoint uses this container's own address, which
      # is where the published port forwards; set it when the container has several networks and
      # the one Docker picked for the mapping is not the one your clients arrive on.
      - DSH_BIND_HOST
      # Public HTTP(S) root to advertise behind a prefix-stripping proxy; left unset when
      # absent. Advertising grants no trust, so the authority above still has to name it.
      - DSH_PUBLIC_URL
      # Proxy settings, from your shell or .env: an unset one is left unset rather than
      # injected empty, and dsh reads both proxy spellings and adds its own loopback bypass.
      # The DeepSeek API key is deliberately absent: add it in the web UI's settings, so it never
      # reaches the image or the process environment.
      - http_proxy
      - https_proxy
      - all_proxy
      - no_proxy
      # Optional: reach GitHub through the host's credential broker instead of a token in this
      # container. The socket directory is a host path owned by the broker's user and is mounted
      # below; the client is already in the image, and `entrypoint.sh` runs `gcb setup` when the
      # socket is there. `GIT_BROKER_REQUIRE=1` fails closed instead of falling back to another
      # credential helper.
      # A host-supervised broker's socket, at the path inside this container. Two shapes:
      #   - in the state directory (already mounted below):
      #       - GIT_BROKER_SOCKET=/home/app/.dsh/git-broker/broker.sock
      #   - a directory of its own, which then has to be mounted (see volumes):
      #       - GIT_BROKER_SOCKET=/run/git-broker/broker.sock
      # - GIT_BROKER_REQUIRE=1
    # Required by the broker's recreate: after `up -d` it watches the container it created and
    # rolls back to the previous image when that container is not **healthy**. A container with no
    # health status at all counts as failed, because a boot line proves nothing on its own — a
    # container can print it and exit. Keep this stanza when you copy the file.
    #
    # The probe is deliberately not 127.0.0.1: that address is right only for a deployment that
    # handed the entrypoint loopback. It asks the address dsh bound (`DSH_BIND_HOST`), falling back
    # to the container's own hostname, which Docker resolves to its address. `--noproxy` is
    # load-bearing: the proxy variables above are in this environment, and without it the probe
    # asks the proxy instead (a measured 502). The status is checked explicitly: 200 (an authorized
    # page), 401 (the boot page without a token) and any 3xx redirect are answers, while a 5xx or no
    # answer at all is not. Accepting curl's exit 22 instead would count every response `curl -f`
    # rejects — a broken deployment's 500 included — as a healthy one.
    healthcheck:
      test:
        - CMD-SHELL
        - |-
          host="$${DSH_BIND_HOST:-$$(node -p "require('os').hostname()")}"
          case "$$host" in *:*) host="[$$host]" ;; esac
          code="$$(curl -sS --noproxy "*" -o /dev/null -w '%{http_code}' "http://$$host:3080/")" || exit 1
          case "$$code" in 200|401|3??) exit 0 ;; *) exit 1 ;; esac
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    ports:
      # Loopback only: put a reverse proxy in front, or widen this to '15080:3080' when the
      # port itself is what you publish.
      - '127.0.0.1:15080:3080'
    volumes:
      # With the broker: its socket directory, owned by the broker's user.
      # Mount for the second shape above; a no-op for the first.
      # - /srv/git-broker-socket:/run/git-broker
      # Only dsh's own state: what else to mount is yours to decide.
      - ./.dsh:/home/app/.dsh
      # With @idsh/host-ops, the broker's socket and its state (the build log a deploy job follows;
      # the state directory is the audit log's dirname, per the broker's README). The whole state
      # directory also holds audit.jsonl (every operation and its arguments), compose.log and
      # rollback. A build writes build-<log>.log, which cannot be mounted ahead of time, so mount
      # the directory (or one known build-<log>.log), not a build.log that only an older broker
      # writes; and remember that
      # Docker creates a directory when the bind source does not exist yet.
      # - ${HOME}/.local/state/idsh-host:/run/idsh-host:ro
      # - ${HOME}/.local/state/idsh-host:/run/idsh-host-state:ro

networks:
  default:
    # Docker gives a container IPv6 addresses only when its network has an IPv6 subnet: this daemon
    # has no default IPv6 address pool (`docker info` lists none), and `enable_ipv6` alone fails
    # with "could not find an available, non-overlapping IPv6 address pool". One explicit subnet is
    # enough — Docker still allocates the IPv4 one automatically.
    #
    # The default is a placeholder: a ULA (RFC 4193, `fc00::/7`) is private and has nothing to do
    # with your ISP prefix, so override `DSH_IPV6_SUBNET` in .env or your shell when it collides
    # with a network or route on the host (check `docker network inspect` and `ip -6 route`); a
    # second deployment on the same host collides on this default too, so give each its own.
    # Nothing here matches the host's global prefix on purpose: the kernel's per-network
    # `disable_ipv6` follows the network, so the image needs no change, and container traffic is
    # routed/NATed by the host like any other private subnet. Remove the whole block to keep the
    # network IPv4-only.
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${DSH_IPV6_SUBNET:-fd00:d5c0:0:1::/64}
