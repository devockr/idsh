name: CI

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check with Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 26 is the line both images pin; 24 is the oldest line above it that `engines` allows.
        node:
          - 24
          - 26
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and everything after the install runs dependency code.
          persist-credentials: false

      # Before setup-node: its `cache: pnpm` needs pnpm on PATH to ask for the store directory.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The image is released from its own version, so a changeset that changes what it bakes has to
      # move that version; without this a forgotten bump would publish packages and ship no image.
      - name: Check the changesets bump the image
        run: node tools/check-image-changesets.mts

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Both images refuse a package whose src is newer than its compiled lib, so a build that
      # fails here is a deployment that cannot be rebuilt.
      - name: Build
        run: pnpm build

      # The recursive `test` script skips a package without one, so the reach of this step grows as
      # packages gain tests — the host broker is the first.
      - name: Test
        run: pnpm test
