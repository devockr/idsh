name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publish that has started has to finish: cancelling it can leave some packages on npm and the
  # rest not.
  cancel-in-progress: false

# Least privilege at the top; a job asks for what it needs.
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # `id-token` is what npm's trusted publishing uses, so publishing needs no NPM_TOKEN; `contents`
      # and `pull-requests` are what the version commit and the "Version Packages" pull request need.
      contents: write
      id-token: write
      pull-requests: write
    # `version` and `publish` are the image's own: read from the tree this job already checked out,
    # and answered by asking the registry. `image/` is private, so an image-only release publishes
    # nothing to npm.
    outputs:
      version: ${{ steps.image-version.outputs.version }}
      publish: ${{ steps.image-version.outputs.publish }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets writes each changelog from the commits since the last release, and the version
          # this push releases is read from the commit before it.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: release package(s)'
          pr-title: 'chore: release package(s)'
          # `pnpm release` is `changeset publish`, whose `pnpm publish` runs each package's
          # `prepack`, so a published tarball always carries a fresh `lib/`.
          publish-script: pnpm release
          version-script: pnpm run version

      # Only a release has an image to consider: while changesets are pending, the action above opens
      # or refreshes the version pull request and publishes nothing, so there is no tag to look for.
      #
      # One step, two answers: the version this release carries, and whether the registry already has
      # it. Asking the registry is what `changeset publish` does with npm — it answers "the same commit
      # was re-run", "the previous attempt failed after the version moved" and "several commits landed
      # at once", none of which a diff against the previous commit can.
      #
      # The tag API rather than `docker manifest inspect`, because the status is the answer: 200 means
      # published, 404 means not, and anything else is an outage or a rate limit, which fails the step.
      # `manifest inspect` exits non-zero for all three, so a broken registry would look like a version
      # that needs building.
      - name: Read the image version and whether it is published
        id: image-version
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          set -euo pipefail
          version=$(jq -r .version image/package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="https://hub.docker.com/v2/namespaces/devockr/repositories/idsh/tags/$version"
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$tag")
          case "$status" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "devockr/idsh:$version is already published"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "devockr/idsh:$version is not published yet"
              ;;
            *)
              echo "Docker Hub answered $status for devockr/idsh:$version" >&2
              exit 1
              ;;
          esac

  image:
    name: Publish the image
    needs: release
    # Only when the registry does not already carry this version — `ci.yml` makes sure a changeset
    # that changes what the image bakes moves it. By this point the packages `Dockerfile` names are
    # on the registry, which is what the build that installs them needs.
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The arm64 half is emulated, so this is minutes of apt, npm and `dsh plugin add`; a build that
    # deadlocks under QEMU should fail rather than sit on the default six-hour budget.
    timeout-minutes: 60
    # `contents` is the top-level grant; this job adds the package it writes.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is built on an amd64 runner, so the emulators its RUN steps need are registered first.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A Docker Hub access token, not the account password, in `DOCKERHUB_TOKEN`. Both logins happen
      # before the build on purpose: a missing one fails the job, rather than leaving one registry a
      # release behind the other.
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both registries carry the same three tags. The job only runs when the version moved, so the
      # version tag always names the build it is attached to.
      - name: Work out the tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          {
            for image in ghcr.io/devockr/idsh docker.io/devockr/idsh; do
              echo "$image:latest"
              echo "$image:sha-${GITHUB_SHA}"
              echo "$image:${VERSION}"
            done
          } > "$RUNNER_TEMP/tags"
          {
            echo 'tags<<TAGS'
            cat "$RUNNER_TEMP/tags"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"

      # The published image is `Dockerfile`'s final stage: the base plus the profile baked from the
      # registry. `:base` is a stage for this image and the dev one, not an image of its own.
      # One manifest list for both architectures the deployments use; the arm64 half runs under QEMU,
      # so it is the slow half of the build.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # GitHub Actions installs from the official registry, not the mirror the
          # Dockerfiles default to for local builds.
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org/
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.title=idsh
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#readme
            org.opencontainers.image.description=Dockerized DeepSeek Harness (dsh) web UI
            org.opencontainers.image.licenses=MIT
          # The image is attested the way the packages are. Both attestations land in
          # this tag's manifest list as extra entries with no real platform, which is
          # why the package page shows "unknown/unknown" rows beside amd64 and arm64 —
          # that is the attestation itself, not a broken build. They record the source
          # revision and the builder run; they do not verify the workflow's identity,
          # which would take a signed artifact attestation this workflow does not do.
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
