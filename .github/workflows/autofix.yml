name: autofix.ci # The workflow using the autofix.ci action has to be named exactly this.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The autofix.ci App applies the fix, so this job's own token only has to read the repository.
permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes: the App commits, and the install runs dependency code.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      # Both fixers run: oxlint for JS/TS, eslint for the Markdown/JSON/YAML/TOML it owns. A rule
      # neither can fix is the CI job's business; this step has to reach the action below, which
      # commits whatever was changed.
      - name: Lint
        continue-on-error: true
        run: pnpm fix

      - name: Apply autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          fail-fast: false
