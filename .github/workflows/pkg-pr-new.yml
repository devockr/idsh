name: Publish Any Commit

on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; packing reads the tree, and the install runs dependency code.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm dlx` keeps this preview-only tool out of the workspace dependencies: a deliberate
      # departure from pkg.pr.new's own advice, which asks CI to run it from the lockfile.
      # `--pnpm` packs with pnpm, and a package's `prepack` builds `lib/` into the tarball.
      - name: Publish
        run: pnpm dlx pkg-pr-new publish --pnpm --packageManager=pnpm './packages/*'
