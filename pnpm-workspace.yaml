# The image needs exactly one file from this tree (entrypoint.sh), so the workspace is for the
# companion plugins under packages/ plus image/, which carries the image's own version — see README.
packages:
  - packages/*
  - image
allowBuilds:
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@1stg/*'
  - '@deepseek-ai/*'
  # 3.8.3 drops an undeclared tslib import that breaks lint on a strict install.
  - eslint-mdx
